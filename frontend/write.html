<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a blog | Tech Verse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ambient-bg" id="ambient-bg" aria-hidden="true">
  <div class="hero-grid-bg"></div>
  <div class="ambient-flare"></div>
  <div class="center-glow"></div>
</div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<main>
<div class="fwrap"><form class="fcard" id="form" novalidate>
  <h1 id="heading">Write a blog</h1><p class="sub">Share what you know. You can save a draft and finish later.</p>
  <label for="title">Title</label><input class="in" id="title" maxlength="140" placeholder="Give your article a clear title">
  <label for="category">Category</label><select class="in" id="category"><option value="">Choose a category</option></select>
  <label for="cover-file">Cover image</label>
  <div class="cover-uploader" id="cover-uploader">
    <div class="cover-file-row">
      <input type="file" id="cover-file" class="in-file" accept="image/png, image/jpeg, image/jpg, image/webp, image/gif">
      <span class="cover-upload-hint" id="cover-upload-hint">JPG, PNG, WEBP, or GIF (max 5MB)</span>
    </div>
    <div class="cover-preview-box" id="cover-preview-box" style="display:none;">
      <img id="cover-preview-img" src="" alt="Cover preview">
      <button type="button" class="btn sm line" id="clear-cover-btn">Remove</button>
    </div>
  </div>
  <label for="cover" style="font-size:12px;color:var(--tx-muted);margin-top:10px;">Or image URL / path</label>
  <input class="in" id="cover" placeholder="assets/covers/git.svg, /uploads/..., or https://">
  <label for="content">Article</label><textarea class="in" id="content" placeholder="Separate paragraphs with a blank line"></textarea>
  <div class="msg" id="msg"></div>
  <div class="acts-row"><button class="btn" type="submit" id="publish">Publish</button><button class="btn line" type="button" id="draft">Save draft</button><a class="btn line" id="cancel" href="my-blogs.html">Cancel</a></div>
</form></div>
</main>
<footer class="foot" id="foot"></footer>
<script src="env.js"></script>
<script src="js/main.js"></script>
<script src="js/write.js"></script>
</body>
</html>
