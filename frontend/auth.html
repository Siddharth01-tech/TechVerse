<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Tech Verse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav" id="nav" aria-label="Main"></nav>
<main>
<div class="fwrap"><form class="fcard narrow" id="form" novalidate>
  <h1 id="heading">Welcome back</h1><p class="sub">Log in to like, comment and publish.</p>
  <div class="seg"><button type="button" id="tab-login" class="on">Log in</button><button type="button" id="tab-signup">Sign up</button></div>
  <div id="name-wrap" style="display:none"><label for="name">Name</label><input class="in" id="name" autocomplete="name"></div>
  <label for="email">Email</label><input class="in" id="email" type="email" autocomplete="email" placeholder="you@example.com">
  <label for="password">Password</label><input class="in" id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
  <div class="msg" id="msg"></div>
  <div class="acts-row"><button class="btn" type="submit" id="submit" style="width:100%">Log in</button></div>
</form></div>
</main>
<footer class="foot" id="foot"></footer>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
